name: Multi-Agent PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run multi-agent review
        run: node review.js "${{ github.event.pull_request.number }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECURITY_MODEL: ${{ vars.SECURITY_MODEL || 'anthropic/claude-opus-4.7' }}
          PERFORMANCE_MODEL: ${{ vars.PERFORMANCE_MODEL || 'anthropic/claude-haiku-4.5' }}
          STYLE_MODEL: ${{ vars.STYLE_MODEL || 'anthropic/claude-haiku-4.5' }}
          TESTS_MODEL: ${{ vars.TESTS_MODEL || 'anthropic/claude-haiku-4.5' }}
